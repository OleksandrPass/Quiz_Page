<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuizBlitz</title>
    <link rel="stylesheet" href="style.css" />
    <link
            href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap"
            rel="stylesheet"
    />
</head>
<body>

<div class="container">

    <header class="header">
        <h1 class="app-title">⚡ QuizBlitz</h1>
        <p class="score">Score: 0 / 5</p>
    </header>

    <main class="quiz-card">

        <p class="question-number"></p>

        <h2 class="question-text"></h2>

        <div class="answers-grid"></div>

        <p class="feedback"></p>

    </main>

</div>

<script src="quiz.js"></script>
</body>
</html>
